apiVersion: apps/v1
kind: Deployment
metadata: 
  name: flask-deployment
spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: flask-app
  template: 
    metadata: 
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-container
        image: airoli/url-shortener-web:latest
        ports: 
        - containerPort: 5000
        env:
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creadentials
              key: db-password
        - name: DB_NAME
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_HOST
          value: "db"

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  ports:  
  - port: 5000
    targetPort: 5000
    nodePort: 30005
  selector:
    app: flask-app 