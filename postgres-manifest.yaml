apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: postgres-app
  template: 
    metadata:
      labels: 
        app: postgres-app
    spec:
      containers:
      - name: postgres-container
        image: postgres:15-alpine
        ports: 
        - containerPort: 5432
        env:
        - name: POSSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creadentials
              key: db-password
        - name: POSTGRES_DB
          value: "postgres"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

      volumes: 
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc 


---
apiVersion: v1
kind: Service
metadata:
  name: db 
spec: 
  ports: 
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-app