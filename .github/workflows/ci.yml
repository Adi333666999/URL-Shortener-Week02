name: Pipeline
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Configure Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Flask and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check app compilation
      run: |
        python -m py_compile app.py

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: code-check

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push uniquely tagged docker image 
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-web"
          TAG_VERSION="v${{ github.run_number }}"

          echo "Building image: $IMAGE_NAME:$TAG_VERSION"

          docker build -t $IMAGE_NAME:$TAG_VERSION -t $IMAGE_NAME:latest .

          docker push $IMAGE_NAME:$TAG_VERSION
          docker push $IMAGE_NAME:latest